name: driver_app
description: Aplicación Android para choferes — plataforma de despachos y GPS.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  geolocator: ^13.0.1
  flutter_foreground_task: ^8.10.4
  sqflite: ^2.3.3
  path: ^1.9.0
  connectivity_plus: ^6.0.5
  battery_plus: ^6.0.2
  uuid: ^4.4.0
  image_picker: ^1.1.2
  signature: ^5.5.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
